<!DOCTYPE html>
<html>
<body>
<h2 id="count">0</h2>
<button onclick="startCounter()">Start Counter</button>
<h2 id="clock"></h2>
<button onclick="startClock()">Start Clock</button>
<h2 id="text">JavaScript</h2>
<button onclick="startColor()">Start</button>
<h2 id="co">0</h2>
<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>
<script>

let count=0;

function startCounter(){

    setInterval(function(){

        count++;

        document.getElementById("count").innerHTML=count;
//  if (count == 10) {

//             clearInterval(timer);

//             alert("Counter Stopped");

//         }
    },1000);

}
function startClock(){

    setInterval(function(){

        let time=new Date();

        document.getElementById("clock").innerHTML=time.toLocaleTimeString();

    },1000);

}
function startColor(){

    setInterval(function(){

        let heading=document.getElementById("text");

        if(heading.style.color=="red"){

            heading.style.color="blue";

        }else{

            heading.style.color="red";

        }

    },1000);

}

let c=0;
let timer;

function start(){

    timer=setInterval(function(){

        c++;

        document.getElementById("co").innerHTML=c;

    },1000);

}

function stop(){

    clearInterval(timer);

}

</script>

</body>
</html>
